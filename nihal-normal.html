<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لنهال 💕</title>
<style>
:root{color-scheme:dark;--bg:#07050f;--pink:#ff6fae;--red:#ff3b5c;--paper:#fff5f7;--ink:#5a2238;--glow:rgba(255,111,174,.45);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:#fff;font-family:"Segoe UI",Tahoma,Arial,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%}
.stage{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:2}
.stage.on{display:flex}
#story{justify-content:flex-start;overflow-y:auto;padding:40px 18px 80px}
.btn{font:inherit;font-size:1.15rem;color:#fff;background:linear-gradient(135deg,var(--red),var(--pink));border:0;border-radius:999px;padding:14px 34px;box-shadow:0 0 28px var(--glow);cursor:pointer}
.big{font-family:"Arial Black",Impact,sans-serif;font-size:clamp(3rem,18vw,7rem);color:var(--pink);text-shadow:0 0 30px var(--glow);animation:pop .6s ease-out;direction:ltr}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
#words{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:3;pointer-events:none}
.heart{font-size:5rem;animation:beat 1.1s infinite}
@keyframes beat{50%{transform:scale(1.18)}}
h2{margin:0 0 6px;font-size:1.5rem;color:var(--pink)}
p.hint{color:#cbb;margin:14px 0 0}
.flame{transform-origin:50% 100%;animation:fl .5s infinite alternate;transition:opacity .4s}
@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.85,1.15)}}
.out .flame{opacity:0}
.fl{position:fixed;bottom:-40px;z-index:1;pointer-events:none;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-110vh) rotate(20deg);opacity:0}}
.env{background:none;border:0;padding:0;cursor:pointer;animation:bob 2.2s ease-in-out infinite}.env svg{width:min(62vw,250px);height:auto;display:block;filter:drop-shadow(0 0 22px var(--glow))}.env .hh{animation:beat 1.2s infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{50%{transform:translateY(-10px)}}
.card{width:min(92%,460px);margin:0 auto 22px;background:var(--paper);color:var(--ink);border-radius:20px;padding:24px 22px;line-height:1.9;font-size:1.08rem;text-align:right;box-shadow:0 0 30px var(--glow);animation:pop .7s ease-out}
.date{background:transparent;color:#fff;border:1px solid var(--pink);text-align:center}
.date b{display:block;font-size:1.7rem;color:var(--pink)}
.photos{display:grid;gap:16px;width:min(92%,460px);margin:0 auto}
.photos figure{margin:0;background:var(--paper);padding:10px 10px 14px;border-radius:6px;color:var(--ink);box-shadow:0 0 24px var(--glow)}
.photos figure:nth-child(odd){transform:rotate(-2deg)}.photos figure:nth-child(even){transform:rotate(2deg)}
.photos img{width:100%;display:block;border-radius:3px}
.photos figcaption{margin-top:8px;font-size:.95rem}
.hid{display:none}
body.rot #rain,body.rot #words{inset:auto;top:0;left:100vw;width:100vh;height:100vw;transform-origin:0 0;transform:rotate(90deg)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<canvas id="sky" class="hid"></canvas>
<div id="words"></div>

<section class="stage on" id="start">
  <div class="heart">💗</div>
  <h2>فيه شي إلك يا نهال</h2>
  <p class="hint">جهّزي موبايلك واضغطي 💗</p>
  <p><button class="btn" id="go">افتحي المفاجأة</button></p>
</section>

<section class="stage" id="cake">
  <h2>كل عام وإنتِ أحلى</h2>
  <svg id="cakesvg" viewBox="0 0 200 190" width="260" height="248" role="img" aria-label="كيكة">
    <g fill="#ffd36b"><ellipse class="flame" cx="70" cy="34" rx="6" ry="11"/><ellipse class="flame" cx="100" cy="30" rx="6" ry="11"/><ellipse class="flame" cx="130" cy="34" rx="6" ry="11"/></g>
    <g fill="#ffe3ee"><rect x="67" y="46" width="6" height="30" rx="2"/><rect x="97" y="42" width="6" height="34" rx="2"/><rect x="127" y="46" width="6" height="30" rx="2"/></g>
    <rect x="40" y="76" width="120" height="40" rx="10" fill="#ff8fbd"/>
    <path d="M40 92q15 14 30 0t30 0 30 0 30 0v-6H40z" fill="#fff5f7"/>
    <rect x="20" y="116" width="160" height="50" rx="12" fill="#ff5c8a"/>
    <path d="M20 134q20 16 40 0t40 0 40 0 40 0v-8H20z" fill="#fff5f7"/>
    <rect x="10" y="166" width="180" height="10" rx="5" fill="#cfa3b8"/>
  </svg>
  <p class="hint" id="ch">اضغطي على الكيكة، اطفي الشموع وتمني أمنية 🕯️</p>
  <p><button class="btn hid" id="next">كمّلي 💌</button></p>
</section>

<section class="stage" id="story">
  <button class="env" id="env" aria-label="افتحي الكرت"><svg viewBox="0 0 220 300" aria-hidden="true"><rect x="4" y="4" width="212" height="292" rx="8" fill="#fffdfd"/><path class="hh" d="M110 238C80 216 90 192 110 207C130 192 140 216 110 238Z" fill="#ff5c6c" stroke="#c0394a" stroke-width="3"/><g id="hand" fill="#fffdfd" stroke="#e2a3ac" stroke-width="3" stroke-linejoin="round"><rect x="38" y="246" width="15" height="46" rx="7" transform="rotate(-12 45 292)"/><rect x="56" y="236" width="15" height="56" rx="7" transform="rotate(-4 63 292)"/><rect x="74" y="238" width="15" height="54" rx="7" transform="rotate(6 81 292)"/><rect x="92" y="252" width="14" height="40" rx="7" transform="rotate(24 99 292)"/><path d="M36 292q4-26 24-24 26 0 40 14l8 10z"/></g><use href="#hand" transform="translate(220 0) scale(-1 1)"/></svg></button>
  <p class="hint" id="eh">اضغطي على الكرت 💗</p>
  <div id="content" class="hid">
    <div class="card" id="letter"></div>
    <div class="card date"><b>٥ تشرين الثاني ٢٠٢٦</b>اليوم اللي بلشت فيه حكايتنا 🤍</div>
    <div class="photos" id="photos"></div>
    <div class="card date" style="margin-top:26px"><b>كل عام وإنتِ حبيبتي 💕</b>هاي أول هدية، بس مش آخر وحدة</div>
  </div>
</section>

var MSG=["كل عام وإنتِ بخير يا نهال 🤍","من يوم ٥ تشرين الثاني وإنتِ دخلتي حياتي وكأنك كنتِ دايماً فيها. ضحكتك بتصلّح أصعب أيامي، وكلامك بيريّحني.","بتمنى كل سنة تكوني فيها أحلى من اللي قبلها، وأكون أنا السبب بأكتر ضحكة فيها.","بحبك كتير 💕"];
var $=function(i){return document.getElementById(i)};
function show(n){document.querySelectorAll('.stage').forEach(function(s){s.classList.toggle('on',s.id===n)})}

// مطر الحروف
var rc=$('rain'),rx=rc.getContext('2d'),drops=[],FS=16,CH="نهالNIHAL♥❤ي";
function size(){var r=document.body.classList.contains('rot');rc.width=r?innerHeight:innerWidth;rc.height=r?innerWidth:innerHeight;drops=[];for(var i=0;i<Math.ceil(rc.width/FS);i++)drops.push(Math.random()*-40)}
size();addEventListener('resize',size);
var rainTimer=null;
function rain(){rx.fillStyle='rgba(7,5,15,.13)';rx.fillRect(0,0,rc.width,rc.height);rx.font=FS+'px monospace';
 drops.forEach(function(y,i){rx.fillStyle=Math.random()<.2?'#ffb3d1':(Math.random()<.5?'#ff3b5c':'#d6245f');rx.fillText(CH[Math.floor(Math.random()*CH.length)],i*FS,y*FS);drops[i]=(y*FS>rc.height&&Math.random()>.975)?0:y+1})}

// سما نجوم
var sc=$('sky'),sx=sc.getContext('2d'),stars=[];
function sky(){sc.width=innerWidth;sc.height=innerHeight;stars=[];for(var i=0;i<110;i++)stars.push({x:Math.random()*sc.width,y:Math.random()*sc.height,r:Math.random()*1.6+.3,p:Math.random()*6})}
function twinkle(t){sx.clearRect(0,0,sc.width,sc.height);stars.forEach(function(s){sx.globalAlpha=.4+.6*Math.abs(Math.sin(t/900+s.p));sx.fillStyle='#fff';sx.beginPath();sx.arc(s.x,s.y,s.r,0,7);sx.fill()});requestAnimationFrame(twinkle)}

function float(n){for(var i=0;i<n;i++){var e=document.createElement('div');e.className='fl';e.textContent=['💗','💖','💕','✨','🌸'][i%5];e.style.left=Math.random()*95+'vw';e.style.fontSize=(14+Math.random()*22)+'px';e.style.animationDuration=(4+Math.random()*4)+'s';document.body.appendChild(e);setTimeout(function(x){x.remove()},9000,e)}}

// التسلسل
addEventListener('resize',function(){if(!sc.classList.contains('hid'))sky()});
var intro=false;function setRot(){return;document.body.classList.toggle('rot',innerHeight>innerWidth);size()}addEventListener('resize',setRot);
$('go').onclick=function(){
 intro=true;setRot();show('none');rainTimer=setInterval(rain,50);
 var seq=['3','2','1','HAPPY','BIRTHDAY','TO','نهال','♥'],w=$('words'),i=0;
 (function step(){
  if(i>=seq.length){try{screen.orientation.unlock();document.exitFullscreen()}catch(e){}intro=false;document.body.classList.remove('rot');clearInterval(rainTimer);rc.classList.add('hid');w.innerHTML='';sc.classList.remove('hid');sky();requestAnimationFrame(twinkle);setInterval(function(){float(1)},900);show('cake');return}
  w.innerHTML='<div class="'+(seq[i]==='♥'?'big heart':'big')+'">'+seq[i]+'</div>';i++;setTimeout(step,i>3?1000:850)})();
};

// الكيكة
$('cakesvg').onclick=function(){if(this.classList.contains('out'))return;this.classList.add('out');$('ch').textContent='يا رب تتحقق أمنيتك ✨';float(30);$('next').classList.remove('hid')};
$('next').onclick=function(){show('story')};

// الظرف
$('env').onclick=function(){
 this.classList.add('hid');$('eh').classList.add('hid');$('content').classList.remove('hid');
 $('letter').innerHTML=MSG.map(function(t){return '<p style="margin:0 0 12px">'+t+'</p>'}).join('');
 $('photos').innerHTML=PHOTOS.map(function(p){return '<figure><img src="'+p.src+'" alt="">'+(p.cap?'<figcaption>'+p.cap+'</figcaption>':'')+'</figure>'}).join('');
 float(20);
};
</script>
